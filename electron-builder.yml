appId: com.lepic.app
productName: LePic
copyright: Copyright © 2026 LeDon

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

asar: true
asarUnpack:
  - '**/*.node'

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  # per-user 安装到 %LOCALAPPDATA%，不触发管理员提权
  perMachine: false
  allowElevation: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LePic
  deleteAppDataOnUninstall: false

# DR-066：自动更新使用 GitHub Release（生成 app-update.yml + latest.yml）
publish:
  provider: github
  owner: LeDonX
  repo: bluu-wallpaper
