appId: com.bluu.app
productName: Bluu
copyright: Copyright © 2026 LeDon

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json

asar: true
asarUnpack:
  - '**/*.node'

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  # per-user 安装到 %LOCALAPPDATA%，不触发管理员提权
  perMachine: false
  allowElevation: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Bluu
  deleteAppDataOnUninstall: false
